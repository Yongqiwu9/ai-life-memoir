[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-life-memoir-backend"
version = "0.1.0"
description = "AI Life Memoir Platform Backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "pyjwt>=2.8,<3.0",
  "bcrypt>=4.2,<6.0",
  "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
]

# Flat-layout package discovery: only ship the `app` package and its subpackages.
# Alembic migrations live in `alembic/` and must not be auto-discovered as a
# distribution package.
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

# The top-level `alembic/` directory holds migration scripts, not a Python
# package of this project, so the Alembic library must stay classified as
# third-party for import sorting.
[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
