name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ai_life_memoir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d ai_life_memoir_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci_test_user:ci_test_password@localhost:5432/ai_life_memoir_test
      TEST_MIGRATION_MODE: "1"
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Ruff
        run: python -m ruff check --config pyproject.toml app tests alembic test_support ../../scripts/ci/run_memory_workflow_postgres.py ../../scripts/ci/run_dialogue_postgres.py
      - name: Ruff format
        run: python -m ruff format --config pyproject.toml --check app tests alembic test_support ../../scripts/ci/run_memory_workflow_postgres.py ../../scripts/ci/run_dialogue_postgres.py
      - name: SQLite fast tests
        run: python -m pytest -m "not integration"
      - name: Alembic heads
        run: python -m alembic heads
      - name: Fresh PostgreSQL upgrade
        run: python -m alembic upgrade head
      - name: Alembic current
        run: python -m alembic current
      - name: Alembic check
        run: python -m alembic check
      - name: PostgreSQL integration tests
        run: python -m pytest -m integration --ignore=tests/integration/test_memory_workflow.py --ignore=tests/integration/test_dialogue.py --ignore=tests/integration/test_dialogue_migration.py
      - name: Post-integration Alembic current
        run: python -m alembic current
      - name: Post-integration Alembic check
        run: python -m alembic check

  memory-workflow-postgres:
    name: B PostgreSQL 16.15
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ci_b_bootstrap
          POSTGRES_PASSWORD: ci-b-bootstrap-synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ci_b_bootstrap -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: B CI script offline contract checks
        run: python -I -B ../../scripts/ci/run_memory_workflow_postgres.py --self-check
      - name: B Manager allocation, migration, Runner tests and verified cleanup
        env:
          CI_B_SERVICE_ID: ${{ job.services.postgres.id }}
          CI_B_PORT: ${{ job.services.postgres.ports[5432] }}
          CI_B_BOOTSTRAP_PASSWORD: ci-b-bootstrap-synthetic-ci-only
        run: python -I -B ../../scripts/ci/run_memory_workflow_postgres.py --ci-manager
      - name: Upload sanitized B validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/b-postgres-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
            ${{ runner.temp }}/b-postgres-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            ${{ runner.temp }}/b-postgres-${{ github.run_id }}-${{ github.run_attempt }}/b-postgres.xml
